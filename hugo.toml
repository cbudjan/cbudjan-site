baseURL = "https://cbudjan.com/"
languageCode = "en-us"
title = "Christoph Budjan"
theme = "cbudjan"                 # folder name under /themes/

enableRobotsTXT = true            # generated from themes/cbudjan/layouts/robots.txt
disableKinds = ["taxonomy", "term"]   # no tags/categories pages

# Navigation menu
[[menus.main]]
  name   = "About"
  url    = "/"
  weight = 1

[[menus.main]]
  name   = "Current Research"
  url    = "/current-research/"
  weight = 2

[[menus.main]]
  name   = "Past Research"
  url    = "/past-research/"
  weight = 3

[[menus.main]]
  name   = "CV & Publications"
  url    = "/cv/"
  weight = 4

[[menus.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 5

# Site-wide parameters
[params]
  description = "Developmental and stem cell biologist at Harvard Medical School / Dana-Farber Cancer Institute."
  defaultImage = "/img/gst-d3-tbxt-594.jpg"   # link-preview image for pages without their own banner

  [params.author]
    name        = "Christoph Budjan, PhD"
    affiliation = "Harvard Medical School · Dana-Farber Cancer Institute"
    jobTitle    = "Research Scientist"

    [[params.author.organizations]]
      name = "Dana-Farber Cancer Institute"
      url  = "https://www.dana-farber.org"
    [[params.author.organizations]]
      name = "Harvard Medical School"
      url  = "https://hms.harvard.edu"

  [params.social]
    orcid     = "0000-0002-1563-9750"
    github    = "cbudjan"
    linkedin  = "cbudjan"                 # your LinkedIn handle
    bluesky   = "cbudjan.com"             # your Bluesky handle
    scholar   = "https://scholar.google.com/citations?user=0A1Fl14AAAAJ"   # full Google Scholar URL

# Markdown rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                       # allow raw HTML in Markdown files
  [markup.highlight]
    style = "github"

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]        # build and deploy on every push to main
  pull_request:             # build only (no deploy) so pull requests get a check
  workflow_dispatch:        # also allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress deployment finish
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"   # pinned; bump deliberately after testing locally

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true          # needed for SCSS/asset pipeline

      - name: Build
        run: hugo --minify --baseURL "https://cbudjan.com/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
